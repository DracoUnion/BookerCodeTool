[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BookerCodeTool"
version = "2026.3.25.0"
description = "iBooker/DracoUnion 代码相关大模型 Agent 工具"
readme = "README.md"
license = {text = "SATA"}
authors = [
    {name = "wizardforcel", email = "wizard.z@qq.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
]
keywords = ["code", "文档", "document", "书籍", "book", "逆向", "re", "IDA"]
requires-python = ">=3.6"
dependencies = [
    "openai",
    "httpx",
    "requests",
    "pyyaml",
    "pydantic",
    "json_repair",
    "pymupdf",
    "pillow",
    "tqdm",
    "pyturndown",
    "ctx-compact",
]

[project.optional-dependencies]
re = [
    "idapro",
    "x64dbg-automate",
]

[project.urls]
Homepage = "https://github.com/DracoUnion/BookerCodeTool"

[project.scripts]
BookerCodeTool = "BookerCodeTool.__main__:main"
code-tool = "BookerCodeTool.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["BookerCodeTool*"]

[tool.setuptools.package-data]
"*" = ["*"]